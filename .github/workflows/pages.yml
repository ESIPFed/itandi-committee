name: Build and deploy archive to GitHub Pages

# Builds the committed docs/ with MkDocs and deploys to GitHub Pages.
# Note: this does NOT run tools/convert.py. Conversion from the esip_wiki
# harvest is a local authoring step (the 4.5 GB harvest is not in this repo);
# CI only builds the Markdown that was committed under docs/.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mkdocs-material
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
